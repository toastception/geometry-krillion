<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050a14">
<title>Geometry Krillion</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#e6f0fa;--mute:#6f8aa8;--line:#17304d;--cy:#5ce1ff;--bad:#ff7a7a;--d:0;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--ink:#06182c;--mute:#46678a;--line:#9fc0e0;--cy:#006f99;--bad:#b3261e;color-scheme:light}}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{min-height:100vh;color:var(--ink);font:500 17px/1.5 Nunito,system-ui,sans-serif;background:linear-gradient(hsl(205 70% calc(22% - var(--d)*16%)),hsl(215 80% calc(9% - var(--d)*6%)) 70%,#050a14);background-attachment:fixed}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]) body{background:linear-gradient(hsl(200 80% calc(92% - var(--d)*30%)),hsl(210 70% calc(80% - var(--d)*35%)))}}
.disp{font-family:"Lilita One",Impact,sans-serif;font-weight:400}
nav{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;max-width:760px;margin:0 auto}
.word{font:400 24px "Lilita One",Impact,sans-serif;letter-spacing:6px;color:var(--ink)}
.word small{font:500 12px Nunito,sans-serif;letter-spacing:1px;color:var(--mute);margin-left:8px}
.pips{display:flex;gap:6px}
.pips i{width:22px;height:5px;border-radius:3px;background:var(--line)}
.pips i.on{background:var(--cy)}
.stage{max-width:620px;margin:0 auto;padding:8px 20px 60px;text-align:center;position:relative}
.rail{position:fixed;left:14px;top:80px;bottom:30px;width:4px;background:var(--line);border-radius:2px}
.diver{position:absolute;left:-10px;width:24px;height:24px;background:#ffd83a;border:3px solid #000;border-radius:3px;top:calc(var(--d) * (100% - 24px));transition:top 1.2s cubic-bezier(.3,1.2,.5,1)}
.depth{font-size:clamp(64px,16vw,112px);line-height:1;margin:18px 0 0;color:var(--ink)}
.sub{color:var(--mute);margin:2px 0 26px}
.q{font-size:clamp(26px,6vw,38px);line-height:1.15;margin:0 0 24px}
.row{display:flex;gap:8px;max-width:440px;margin:0 auto}
input{flex:1;min-width:0;font:inherit;font-size:19px;text-align:center;padding:12px;background:transparent;color:var(--ink);border:0;border-bottom:3px solid var(--line);border-radius:0}
input:focus{outline:0;border-bottom-color:var(--cy)}
button{font:400 20px "Lilita One",Impact,sans-serif;letter-spacing:1px;padding:10px 22px;border:0;border-radius:24px;background:var(--cy);color:#02111c;cursor:pointer}
button:focus-visible{outline:3px solid #ffd83a;outline-offset:3px}
button:disabled{opacity:.4}
button.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.msg{min-height:4.5em;margin:20px 0 0}
.warn{color:var(--bad);font-weight:700}
.tier{background:#6f8aa8;display:inline-block;font:400 22px "Lilita One",Impact,sans-serif;padding:2px 16px;border-radius:20px;color:#02111c}
.t0{background:#9fb3c8}.t1{background:#ffcf5c}.t2{background:#5ce1ff}.t3{background:#6f9bff}.t4{background:#b57bff}.t5{background:linear-gradient(90deg,#ff7ac6,#ffd83a)}
.tier{animation:pop .18s ease-out}@keyframes pop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}
.pts{display:block;color:var(--mute);margin-top:6px}
.list{max-width:360px;margin:20px auto;text-align:left}
.list div{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)}
.note{color:var(--mute);font-size:13px;margin:36px auto 0;max-width:520px}
@media (max-width:640px){.rail{display:none}}
@media (prefers-reduced-motion:reduce){.diver{transition:none}.tier{animation:none}}
</style>
<style>
.stack{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.who{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:16px}
.who span{padding:2px 12px;border-radius:14px;border:2px solid var(--line);font-size:14px;color:var(--mute)}
.who span.ok{border-color:var(--cy);color:var(--cy)}
.tbl{max-width:460px;margin:18px auto;text-align:left}
.tbl>div{display:grid;grid-template-columns:1fr auto auto;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.tbl .me{color:var(--cy);font-weight:700}
.tbl small{color:var(--mute)}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-left:3px;background:#6f8aa8}
.barm{height:8px;background:var(--line);border-radius:4px;margin-top:5px}
.barm i{display:block;height:100%;background:var(--cy);border-radius:4px}
.chip{font:400 15px "Lilita One",Impact,sans-serif;letter-spacing:2px;color:var(--mute)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin:0 auto 18px;max-width:440px}
.bar i{display:block;height:100%;background:var(--cy);width:100%}
.err{color:var(--bad);min-height:1.5em;margin:10px 0 0}
</style>
</head>
<body>
<nav><div class="word">KRILLION<small>geometry dash</small></div><div style="display:flex;gap:14px;align-items:center"><span class="chip" id="chip"></span><div class="pips" id="pips"></div></div></nav>
<div class="rail"><div class="diver"></div></div>
<div class="stage" id="stage"></div>
<script>
const NM=["Plankton","Too Clever","Schooler","Rare","Deep Cut","One in a Krillion"];
const $=id=>document.getElementById(id),S=$("stage"),R=document.documentElement;
let me=null,es=null,st=null,endAt=0,tot=1,leaving=false;addEventListener("pagehide",()=>{leaving=true});
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k)||"";localStorage.setItem(k,v)}catch(e){return""}};
try{me=JSON.parse(sessionStorage.getItem("gk_me")||"null")}catch(e){}
const keep=()=>{try{me?sessionStorage.setItem("gk_me",JSON.stringify(me)):sessionStorage.removeItem("gk_me")}catch(e){}};
const api=(a,b)=>fetch("/api",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({a,room:me&&me.room,pid:me&&me.pid,...b})}).then(r=>r.json()).catch(()=>({ok:false,err:"Can’t reach the server."}));
const mine=()=>st.players.find(p=>p.id===st.you)||{pts:0};
const el=(t,c,x)=>{const e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e};
const tierEl=(t,sz)=>{const e=el("span","tier "+(t==null?"":"t"+t),t==null?"No answer":NM[t]);if(sz)e.style.cssText="font-size:"+sz+"px;padding:0 12px";return e};
const m=p=>(p*10).toLocaleString()+" m";

function connect(){if(es)es.close();es=new EventSource("/events?room="+me.room+"&pid="+me.pid);
 es.onmessage=e=>{st=JSON.parse(e.data);endAt=st.msLeft==null?0:Date.now()+st.msLeft;tot=st.totalMs;
  if(st.phase==="round"&&st.q){try{const s=JSON.parse(ls("gk_seen")||"[]");if(!s.includes(st.q)){s.push(st.q);ls("gk_seen",JSON.stringify(s.slice(-200)))}}catch(e){}}render()};
 es.onerror=()=>{if(es.readyState!==2||leaving||!me)return;api("join",{pid:me.pid}).then(r=>{if(!r.ok&&r.err!=="Can’t reach the server.")drop("That room has ended.");else setTimeout(()=>{if(me&&!leaving)connect()},1500)})}}
function drop(msg){if(es)es.close();me=null;st=null;keep();menu(msg)}
async function enter(r,msg){if(!r.ok){$("err").textContent=r.err||"Something went wrong.";return false}me={room:r.room,pid:r.pid};keep();connect();return true}

function menu(msg){st=null;endAt=0;R.style.setProperty("--d",0);$("chip").textContent="";$("pips").innerHTML="";S.dataset.v="menu";
 S.innerHTML="<h1 class='depth disp'>0 m</h1><p class='sub'>descending…</p><h2 class='q disp'>Dive solo, or race your friends down the same seven prompts.</h2><div class='row'><input id='nm' maxlength='16' placeholder='Your name' aria-label='Your name'></div><p class='err' id='err' role='alert'></p><div class='stack'><button id='solo'>Solo dive</button><button id='mk' class='ghost'>Create room</button></div><div class='row' style='margin-top:20px'><input id='cd' maxlength='4' placeholder='Room code' aria-label='Room code' style='text-transform:uppercase'><button id='jn' class='ghost'>Join</button></div><p class='note'>Fan-made and unofficial, inspired by krillion.io. Scoring copies Krillion’s tiers (10, 15, 30, 60, 85, 100 points; 1 point = 10 m). Which tier an answer lands in is my own judgment, not real player data. Valid answers are checked on the server and are never shown.</p>";
 $("nm").value=ls("gk_name");$("err").textContent=msg||"";
 const q=new URLSearchParams(location.search).get("room");if(q)$("cd").value=q.slice(0,4).toUpperCase();
 const nm=()=>{const v=$("nm").value.trim()||"Diver";ls("gk_name",v);return v};
 $("solo").onclick=async()=>{const r=await api("create",{name:nm(),timed:false,seen:JSON.parse(ls("gk_seen")||"[]")});if(!r.ok)return $("err").textContent=r.err;me={room:r.room,pid:r.pid};keep();await api("start");connect()};
 $("mk").onclick=async()=>enter(await api("create",{name:nm(),timed:true,seen:JSON.parse(ls("gk_seen")||"[]")}));
 $("jn").onclick=async()=>enter(await api("join",{room:$("cd").value.trim().toUpperCase(),name:nm()}))}

function nav(){$("chip").textContent=st.players.length>1||st.timed?"ROOM "+st.code:"";
 $("pips").innerHTML=Array.from({length:st.total},(_,k)=>"<i class='"+(k<st.round-(st.phase==="round"?1:0)?"on":"")+"'></i>").join("");
 R.style.setProperty("--d",Math.min(mine().pts/700,1))}

function render(){nav();const v=st.phase;if(v==="lobby")lobby();else if(v==="round")round();else if(v==="reveal")reveal();else final()}

function roster(box){box.innerHTML="";st.players.forEach(p=>{const d=el("div",null,"");d.style.cssText="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--line)";d.append(el("span",p.id===st.you?"me":"",p.name+(p.host?" (host)":"")),el("span","",p.on?"here":"away"));box.append(d)})}
function lobby(){S.dataset.v="lobby";const host=st.players.find(p=>p.host&&p.id===st.you);
 S.innerHTML="<p class='sub'>room code</p><div class='depth disp' style='letter-spacing:10px;font-size:clamp(56px,14vw,96px)'>"+st.code+"</div><div class='stack'><button class='ghost' id='cp'>Copy invite link</button></div><div class='list' id='pl'></div><div class='stack' id='act'></div><p class='err' id='err'></p>";
 roster($("pl"));$("cp").onclick=()=>{const u=location.origin+"/?room="+st.code;(navigator.clipboard?navigator.clipboard.writeText(u):Promise.reject()).then(()=>$("cp").textContent="Copied!",()=>$("cp").textContent=u)};
 const a=$("act");if(host){const b=el("button","","Start dive");b.onclick=()=>api("start");a.append(b)}else a.append(el("p","sub","Waiting for the host to start…"));
 const l=el("button","ghost","Leave");l.onclick=async()=>{await api("leave");drop()};a.append(l)}

function round(){const key="r"+st.round+"|"+st.code;
 if(S.dataset.v!==key){S.dataset.v=key;
  S.innerHTML="<div class='depth disp' id='dp'></div><p class='sub'>prompt "+st.round+" of "+st.total+"<span id='cd2'></span></p>"+(st.timed?"<div class='bar' id='bar'><i></i></div>":"")+"<h2 class='q disp' id='q'></h2><div class='row'><input id='in' autocomplete='off' aria-label='Your answer' placeholder='Type one answer'><button id='go'>Dive</button></div><p class='msg' id='msg' aria-live='polite'></p><div class='who' id='who'></div>";
  $("q").textContent=st.q;$("in").focus();
  const send=async()=>{const i=$("in");if(i.disabled||!i.value.trim())return;const r=await api("answer",{text:i.value});
   if(r.invalid){const g=r.misses>=5?"<br><button class='ghost' id='gu'>Give up on this prompt (0 points)</button>":"";$("msg").innerHTML="<span class='warn'>That one isn’t accepted. Try another answer.</span>"+g;if($("gu"))$("gu").onclick=()=>api("giveup");i.select()}};
  $("go").onclick=send;$("in").addEventListener("keydown",e=>{if(e.key==="Enter")send()})}
 $("dp").textContent=m(mine().pts);
 const who=$("who");who.innerHTML="";st.players.forEach(p=>{if(st.players.length<2)return;const s=el("span",p.done?"ok":"",(p.done?"✓ ":"")+p.name);who.append(s)});
 if(st.my){$("in").disabled=true;$("go").hidden=true;const g=st.my.gain;$("msg").innerHTML="";const t=tierEl(st.my.tier);const d=el("span","pts",(st.my.name?st.my.name+": ":"")+(g?"+"+g+" points, +"+g*10+" m":"No points"));$("msg").append(t,d);
  if(st.players.length>1)$("msg").append(el("span","pts","Waiting for the others…"))}}

function reveal(){S.dataset.v="rv"+st.round;const host=st.players.find(p=>p.host&&p.id===st.you),last=st.round>=st.total;
 S.innerHTML="<div class='depth disp'>"+m(mine().pts)+"</div><p class='sub'>prompt "+st.round+" of "+st.total+" results<span id='cd2'></span></p><div class='tbl' id='tb'></div><div class='stack' id='act'></div>";
 const tb=$("tb");st.results.forEach(r=>{const d=el("div",r.id===st.you?"me":"");const n=el("div");n.append(el("div","",r.name));const b=el("div","barm");const i=el("i");i.style.width=Math.min(r.pts/7,100)+"%";b.append(i);n.append(b);
  const t=el("div");t.append(tierEl(r.tier,15));d.append(n,t,el("div","",(r.gain?"+"+r.gain:"0")+" · "+m(r.pts)));tb.append(d)});
 const a=$("act");if(host){const b=el("button","",last?"See your dive":"Next prompt");b.disabled=true;setTimeout(()=>b.disabled=false,700);b.onclick=()=>api("next");a.append(b)}else a.append(el("p","sub","Waiting for the host…"))}

function final(){S.dataset.v="final";const host=st.players.find(p=>p.host&&p.id===st.you),top=st.results[0];
 S.innerHTML="<div class='depth disp'>"+m(mine().pts)+"</div><p class='sub'>"+mine().pts+" of 700 points</p><h2 class='q disp' id='h'></h2><div class='tbl' id='tb'></div><div class='stack' id='act'></div>";
 $("h").textContent=st.results.length>1?(st.results[1].pts===top.pts?"It’s a tie.":top.name+" dove deepest."):(mine().pts>=700?"One in a krillion.":mine().pts>=420?"Deep water.":mine().pts>=210?"Past the shallows.":"Still near the surface.");
 st.results.forEach((r,k)=>{const d=el("div",r.id===st.you?"me":"");const n=el("div");n.append(el("div","",(k+1)+". "+r.name));const dots=el("div");dots.style.marginTop="6px";r.tiers.forEach(t=>dots.append(Object.assign(el("i","dot "+(t==null?"":"t"+t)),{title:t==null?"No answer":NM[t]})));n.append(dots);d.append(n,el("div"),el("div","",m(r.pts)));$("tb").append(d)});
 const a=$("act");if(host){const b=el("button","","Dive again");b.onclick=()=>api("start");a.append(b)}const l=el("button","ghost","Leave");l.onclick=async()=>{await api("leave");drop()};a.append(l)}

setInterval(()=>{if(!st||!endAt)return;const l=Math.max(0,endAt-Date.now()),b=$("bar");if(b)b.firstChild.style.width=(l/tot*100)+"%";const c=$("cd2");if(c)c.textContent=" · "+Math.ceil(l/1000)+"s"},200);
if(me)connect();else menu();
</script>
</body>
</html>
